<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0a0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Next 18" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>The Next 18 — Edwin & Mindy's Anniversary Intimacy Course</title>
    <style>
      /* Critical loading styles */
      body { margin: 0; background: #0f0a0e; }
      #loading-screen {
        position: fixed; inset: 0; background: #0f0a0e;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.5s;
      }
      #loading-screen .loader {
        width: 60px; height: 60px; border-radius: 50%;
        border: 3px solid rgba(212,165,116,0.15);
        border-top-color: #d4a574;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loading-screen"><div class="loader"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove loading screen after app mounts
      setTimeout(() => {
        const ls = document.getElementById('loading-screen');
        if (ls) { ls.style.opacity = '0'; setTimeout(() => ls.remove(), 500); }
      }, 800);
    </script>
  </body>
</html>
